name: Deploy Frontend

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Copy dist to server (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          source:   "dist/*"
          target:   /tmp/syncwatch-frontend/
          strip_components: 1          # убрать префикс dist/

      - name: Publish to web root & reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            sudo rm -rf /var/www/syncwatch/*
            sudo cp -r /tmp/syncwatch-frontend/* /var/www/syncwatch/
            rm -rf /tmp/syncwatch-frontend
            sudo nginx -t && sudo systemctl reload nginx
            echo " ✓ frontend published"
